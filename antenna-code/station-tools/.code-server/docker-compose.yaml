---
services:
  code-server:
    image: lscr.io/linuxserver/code-server:latest
    container_name: code-server
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - DEFAULT_WORKSPACE=/home/keithm/ROV2/antenna-code/station-tools #optional
    volumes:
      - /home/keithm/ROV2/antenna-code/station-tools/.code-server/:/config
    ports:
      - 8443:8443
    restart: unless-stopped
